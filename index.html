<!DOCTYPE html>
<html>
<head>
  <title>Lab 5</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Billboard.js CSS -->
  <link href="https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist/billboard.min.css" rel="stylesheet">

  <style>
    /* Ensure the map has a defined height */
    #map {
      height: 600px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- External Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist/billboard.pkgd.min.js"></script>
  
  <!-- Your Data File -->
  <script src="citypop.js"></script>

  <!-- Main Map Logic -->
  <script>
    // 1. Initialize the Leaflet map (centered on the US as a default)
    var map = L.map('map').setView([39.8283, -98.5795], 4);

    // Add a base tile layer (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var cities; // Global variable for city circle layers

    // 2. Run the functions in order (now that data and map are loaded)
    var info = processData(data);
    createPropSymbols(info.timestamps, data);

    // Function to extract timestamps and min/max values
    function processData(data) {
      var timestamps = [];
      var min = Infinity;
      var max = -Infinity;

      for (var feature in data.features) {
        var properties = data.features[feature].properties;

        for (var attribute in properties) {
          if (
            attribute != 'id' &&
            attribute != 'name' &&
            attribute != 'latitude' &&
            attribute != 'longitude'
          ) {
            if (timestamps.indexOf(attribute) === -1) {
              timestamps.push(attribute);
            }

            var value = Number(properties[attribute]);
            if (value < min) {
              min = value;
            }
            if (value > max) {
              max = value;
            }
          }
        }
      }

      return {
        timestamps: timestamps,
        min: min,
        max: max
      };
    }

    // Function to draw the proportional symbols
    function createPropSymbols(timestamps, data) {
      cities = L.geoJson(data, {
        pointToLayer: function(feature, latlng) {
          return L.circleMarker(latlng, {
            fillColor: "#501e65",
            color: '#501e65',
            weight: 2,
            fillOpacity: 0.5
          }).on({
            mouseover: function(e) {
              this.openPopup();
              this.setStyle({ fillColor: 'green' });
            },
            mouseout: function(e) {
              this.closePopup();
              this.setStyle({ fillColor: '#501e65' });
            }
          });
        }
      }).addTo(map);

      updatePropSymbols(timestamps[0]);
    }

    // Function to update/resize each circle marker
    function updatePropSymbols(timestamp) {
      cities.eachLayer(function(layer) {
        var props = layer.feature.properties;
        var radius = calcPropRadius(Number(props[timestamp]));
        var popupContent = props.name + ' ' + timestamp + ' population: ' + Number(props[timestamp]).toLocaleString();

        layer.setRadius(radius);
        layer.bindPopup(popupContent, { offset: new L.Point(0, -radius) });
      });
    }

    // Calculate the radius of the proportional symbols based on area
    function calcPropRadius(attributeValue) {
      var scaleFactor = 0.001;
      var area = attributeValue * scaleFactor;
      return Math.sqrt(area / Math.PI);
    }
  </script>

</body>
</html>
