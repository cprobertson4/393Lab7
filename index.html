
<!DOCTYPE html>
<html>
    <head>
        <title>Lab 7</title>

         <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
           integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
           crossorigin=""/>

         <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
           integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
           crossorigin=""></script>
        
        <script src="citypop.js"></script>
        
        <style type="text/css">
          html, body { margin: 0; padding: 0; height: 100%; }
          #map { min-height: 100%; }
            
        .time-control {
            display: flex;         
            align-items: center;
            gap: 8px;              
            padding: 6px 15px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .temporal-legend {
            font-weight: bold;
        }
               
        .play-button {
            font: inherit;
            padding: 4px 12px;
            cursor: pointer;
        }
            
        
        .legend {
            padding: 6px 15px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        #legendTitle {
            text-align: center;
            margin-bottom: 15px;
            font-variant: small-caps;
        }
        .symbolsContainer {
            float: left;
            margin-left: 50px;
        }
        .legendCircle {
            border-radius: 50%;
            border: 2px solid #501e65;
            background: rgba(80, 30, 101, .5);
            display: inline-block;
        }
        .legendValue {
            position: absolute;
            right: 8px;
        }
        </style>

    </head>

    <body>
        <div id="map"></div>

        <script type="text/javascript">

          var map = L.map('map', {
              center: [39.23, -97.47],
              zoom: 4
          });

         L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);
            
        
        
        var info = processData(data);   
        createPropSymbols(info.timestamps, data);
        createSliderUI(info.timestamps);
        createPlayButton(info.timestamps);
        createLegend(info.min, info.max);
            
        function processData(data) {
          
          var timestamps = [];  
                                
          var min = Infinity;   
          var max = -Infinity;  

          
          for (var feature in data.features) {
              var properties = data.features[feature].properties;

              
              for (var attribute in properties) {
                  if ( attribute != 'id' &&
                       attribute != 'name' &&
                       attribute != 'latitude' &&
                       attribute != 'longitude' )   
                                                    
                                                    
                  {
                      if ( timestamps.indexOf(attribute) === -1 ) { 
                                                                    
                                                                    

                          timestamps.push(attribute);  
                      }
                      var value = Number(properties[attribute]); 
                      if (value < min) {
                          min = value; 
                      }
                      if (value > max) {
                          max = value; 
                      }
                  }
              }
          }
          return { 
              timestamps : timestamps,
              min : min,
              max : max
          }
        }
            
        
        var cities;   

        
        function createPropSymbols(timestamps, data) {

          cities = L.geoJson(data, {

              
              
              pointToLayer: function(feature, latlng) {
                  return L.circleMarker(latlng, { 
                      fillColor: "#502e65",  
                      color: '#121e50',      
                      weight: 2,             
                      fillOpacity: 0.5       
                  }).on({
                        mouseover: function(e) {
                            this.openPopup();
                            this.setStyle({fillColor: 'green'});  
                        },
                        mouseout: function(e) {
                            this.closePopup();
                            this.setStyle({fillColor: '#301e50'});  
                        }
                });
              }
          }).addTo(map);

          updatePropSymbols(timestamps[0]); 
                                            
        }

        
        function updatePropSymbols(timestamp) {

          cities.eachLayer(function(layer) {  
              var props = layer.feature.properties;   
              var radius = calcPropRadius(Number(props[timestamp])); 

              
              
              var popupContent = props.name + ' ' + timestamp + ' population: ' + Number(props[timestamp]).toLocaleString();

              layer.setRadius(radius);  
              layer.bindPopup(popupContent, { offset: new L.Point(0,-radius) });
          });
        }

        
        function calcPropRadius(attributeValue) {

          var scaleFactor = 0.001;   
                                     
          var area = attributeValue * scaleFactor;

          return Math.sqrt(area/Math.PI);  
        }
            
            
        var slider;   

        function createSliderUI(timestamps) {
          var sliderControl = L.control({ position: 'bottomleft' }); 
                                                                    
          sliderControl.onAdd = function(map) {
              
              var container = L.DomUtil.create("div", "time-control");
              
              L.DomEvent.disableClickPropagation(container); 
              
              slider = L.DomUtil.create("input", "range-slider", container);
              slider.type = "range";
              slider.min = 0;                      
              slider.max = timestamps.length - 1;  
              slider.step = 1;                     
              slider.value = 0;                    
              slider.setAttribute("aria-label", "Year");  

              
              var label = L.DomUtil.create("output", "temporal-legend", container);
              label.textContent = timestamps[0];

              
              slider.addEventListener("input", function() {
                  showTimestamp(timestamps[slider.value]);
              });

              return container;
          };
          sliderControl.addTo(map);
        }

       
        function showTimestamp(timestamp) {
          updatePropSymbols(timestamp);
          document.querySelector(".temporal-legend").textContent = timestamp;
        }
            
        
        function createPlayButton(timestamps) {
          var speed = 1000;   
                              
          var timer = null;   

          
          var button = L.DomUtil.create("button", "play-button");
          button.textContent = "Play";
          document.querySelector(".time-control").prepend(button);

          
          button.addEventListener("click", function() {
              if (timer !== null) {   
                  stopPlaying();
                  return;
              }
              if (Number(slider.value) === timestamps.length - 1) {   
                  slider.value = 0;
                  showTimestamp(timestamps[0]);
              }
              button.textContent = "Pause";

              
              timer = setInterval(function() {
                  var next = Number(slider.value) + 1;   
                  slider.value = next;
                  showTimestamp(timestamps[next]);
                  if (next === timestamps.length - 1) {  
                      stopPlaying();
                  }
              }, speed);
          });

          function stopPlaying() {
              clearInterval(timer);   
              timer = null;
              button.textContent = "Play";
          }
        }
            
        
        function createLegend(min, max) {

            if (min < 10) {
                min = 10;
            }

            
            function roundNumber(inNumber) {
                var unit = Math.pow(10, Math.floor(Math.log10(inNumber)) - 1);
                return Math.round(inNumber / unit) * unit;
            }

            var legend = L.control( { position: 'bottomright'} );

            legend.onAdd = function(map) {

                var legendContainer = L.DomUtil.create("div", "legend");
                L.DomEvent.disableClickPropagation(legendContainer);

                
                legendContainer.innerHTML = "<h2 id='legendTitle'>Total Population</h2>";

                var symbolsContainer = L.DomUtil.create("div", "symbolsContainer", legendContainer);
                var classes = [roundNumber(min), roundNumber((max-min)/2), roundNumber(max)]; 
                var lastRadius = 0;

                for (var i = 0; i < classes.length; i++) {

                    var legendCircle = L.DomUtil.create("div", "legendCircle", symbolsContainer);
                    var currentRadius = calcPropRadius(classes[i]);  
                    var margin = -currentRadius - lastRadius - 5;

                    legendCircle.style.width = currentRadius*2 + "px";
                    legendCircle.style.height = currentRadius*2 + "px";
                    legendCircle.style.marginLeft = margin + "px";
                    legendCircle.innerHTML = "<span class='legendValue'>" + classes[i].toLocaleString() + "</span>";

                    lastRadius = currentRadius;
                }

                return legendContainer;
            };

            legend.addTo(map);
        }

        </script>
   </body>
</html>
  </script>

</body>
</html>
